          fetch(url, { priority: 'low' }).catch(function () {});

          document.body.appendChild(ov);

            ov.style.transition = 'none';
            ov.offsetHeight;
            ov.style.opacity = '1';
            var f = 0;
            function tick() {
              if (++f < 12) requestAnimationFrame(tick);
              else { ov.style.transition = 'opacity .3s ease'; ov.style.opacity = '0'; }
            }
            requestAnimationFrame(tick);
          }, { once: true });
        }
      });
