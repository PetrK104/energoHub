[build]
  command = "node build-icons.mjs && node build-og.mjs && node build-search.mjs"
  functions = "netlify/functions"
  publish = "."
  environment = { SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL" }

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/hdri/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/search.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/3d_main/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/hero3d-poster.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Interní soubory repozitáře nejsou součástí webu: veřejně se tváří jako neexistující stránky (404).
# Netlify funkce na adrese /.netlify/functions/ tím nejsou dotčeny.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
